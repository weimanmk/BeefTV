plugins { id 'com.android.application' }
android {
    namespace 'com.weimanmk.beeftv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.weimanmk.beeftv'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1.0-mobile'
        testInstrumentationRunner 'com.weimanmk.beeftv.MobileSmoke'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false } }
}
